name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --python ${{ matrix.python }}
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run lint-imports
      - run: uv run pytest -q
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: No copyleft dependencies (MIT project)
        run: uv run --with pip-licenses pip-licenses --fail-on="GNU General Public License v2 (GPLv2);GNU General Public License v3 (GPLv3);GNU Affero General Public License v3 (AGPLv3);GPL-2.0;GPL-3.0;AGPL-3.0"
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: ui/pnpm-lock.yaml }
      - run: uv sync --all-extras
      - working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm tsc --noEmit
          pnpm vitest run
          pnpm build
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Require Signed-off-by on every commit
        run: |
          bad=$(git log --format='%H %s' origin/${{ github.base_ref }}..HEAD --grep='^Signed-off-by:' --invert-grep | grep -v ' Merge ' || true)
          [ -z "$bad" ] || { echo "Missing DCO sign-off (use git commit -s):"; echo "$bad"; exit 1; }
