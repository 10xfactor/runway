[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runway-ai"
version = "0.1.0.dev0"
description = "Agentic + deterministic framework: probabilistic agents propose, a deterministic runtime commits."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2.6.0",
  "litellm>=1.30.0",
  "networkx>=3.2",
  "typer>=0.9.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn>=0.27", "sse-starlette>=2.0"]

[project.scripts]
runway = "runway.cli.main:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
  "import-linter>=2.0",
  "types-networkx",
]

[tool.hatch.build.targets.wheel]
packages = ["src/runway"]
# built UI is gitignored; ship it in the wheel (run `make ui` first)
artifacts = ["src/runway/server/static/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/runway/server/static/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/runway"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["litellm.*", "networkx.*", "sse_starlette.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "runway"

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
  "runway.cli",
  "runway.server",
  "runway.api",
  "runway.runtime",
  "runway.adapters",
  "runway.ports",
  "runway.core",
]

[[tool.mypy.overrides]]
module = "runway.demo"
# @agent stubs: the docstring is the prompt, the body is intentionally empty.
disable_error_code = ["empty-body"]

[[tool.mypy.overrides]]
module = "runway.adapters.llm_litellm"
disable_error_code = ["attr-defined"]
